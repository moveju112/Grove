[package]
name = "grove"
version = "0.1.11"
edition = "2024"
rust-version = "1.93"
description = "Grove: single-binary agent server with a shared web app"
license = "Apache-2.0"
publish = false

[[bin]]
name = "grove"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "process", "io-util", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["limit", "trace", "fs", "set-header"] }
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled", "backup", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "v4"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
iana-time-zone = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rand = "0.9"
base64 = "0.22"
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
bytes = "1"
regex = "1"
globset = "0.4"
ignore = "0.4"
ts-rs = { version = "11", features = ["serde-json-impl"] }
portable-pty = "0.9"
vt100 = "=0.16.2"
ed25519-dalek = "2"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
chacha20poly1305 = "0.10"
aes-gcm = "=0.10.3"
hkdf = "=0.12.4"
ring = "=0.17.14"
curve25519-dalek = "=4.1.3"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
cap-std = "=4.0.3"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# 소유 프로세스 트리 Job Object(SEC-014). 이미 의존성 그래프에 있는 버전을 쓴다.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_StationsAndDesktops", "Win32_System_RemoteDesktop", "Win32_System_SystemServices", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled", "backup", "functions"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "blocking"] }

[profile.test]
debug = "line-tables-only"
incremental = false

# 시험 시간 대부분은 SQLite·암호화 같은 의존성 안에서 쓴다. 의존성만 최적화하고 grove 자체는 빠른 컴파일을 유지한다.
[profile.test.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
