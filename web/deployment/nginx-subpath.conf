# 기존 HTTPS server 블록 안에 포함하는 /grove/ 배포 예제.
# GROVE_WEB_BASE=/grove/로 빌드한 web/build/client의 내용을 /srv/grove-site/grove/에 배치한다.
# TLS·인증·CSP 정책은 기존 설정을 유지한다.
root /srv/grove-site;

location = /api {
    add_header Cache-Control "no-store" always;
    default_type application/json;
    return 404 '{"error":{"code":"not_found"}}';
}

location ^~ /api/v1/ {
    proxy_pass http://127.0.0.1:7740;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    add_header Cache-Control "no-store" always;
}

location ^~ /api/ {
    add_header Cache-Control "no-store" always;
    default_type application/json;
    return 404 '{"error":{"code":"not_found"}}';
}

location = /grove {
    return 308 /grove/$is_args$args;
}

# API는 origin 루트의 /api/v1 계약을 유지한다. 잘못 붙은 UI base도 HTML로 감추지 않는다.
location = /grove/api {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 404 '{"error":{"code":"not_found"}}';
}

location ^~ /grove/api/ {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 404 '{"error":{"code":"not_found"}}';
}

location ^~ /grove/assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location = /grove/sw.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}

location = /grove/manifest.webmanifest {
    try_files $uri =404;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
}

location /grove/ {
    try_files $uri $uri/ /grove/index.html;
    add_header Cache-Control "no-cache" always;
}

# 다른 앱이 있는 server 블록에서는 그 앱의 기존 location을 그대로 유지한다.
# 전용 호스트라면 /grove/ 밖에 전역 SPA fallback을 두지 않는다.
