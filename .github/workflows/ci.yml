# PR·main에서는 웹·브라우저를 검사한다. Rust 전체 검사는 로컬 공개 릴리즈 절차에서 실행한다.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run theme:check

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            relay/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: relay
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: 'false'
      - name: Mobile browser tests
        env:
          GROVE_E2E_FAKE_CLI: '1'
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          python3 scripts/build.py test --e2e 'e2e/.*\.mobile\.spec\.ts' --e2e-regression
      - name: Codex browser test
        if: ${{ !cancelled() }}
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          GROVE_E2E_FAKE_CLI=1 python3 scripts/build.py test --e2e e2e/cli-turn.spec.ts --e2e-regression
      - name: Relay browser tests
        if: ${{ !cancelled() }}
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          python3 scripts/build.py test --relay-e2e
